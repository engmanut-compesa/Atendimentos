<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Registro de Atendimentos</title>
<meta name="theme-color" content="#0b6e7f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Atendimentos">
<style>
:root{
  --bg:#eef2f3; --surface:#ffffff; --ink:#14232b; --muted:#5b6b73; --line:#cfd9dc;
  --accent:#0b6e7f; --accent-ink:#ffffff; --accent-soft:#d6ecef;
  --ok:#1f7a3d; --warn:#a86a00; --bad:#b3261e; --info:#1d5fae; --shop:#2b2b2b;
  --ok-bg:#e1f2e6; --warn-bg:#fbefd6; --bad-bg:#fbe3e1; --info-bg:#e2ecfa; --shop-bg:#e6e6e6;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,Menlo,Consolas,"Roboto Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e171b; --surface:#16232a; --ink:#e4ecee; --muted:#93a5ac; --line:#2a3b43;
  --accent:#4fb3c4; --accent-ink:#06191d; --accent-soft:#163a41;
  --ok:#6cc98a; --warn:#e3b15a; --bad:#f08a82; --info:#86b2f0; --shop:#cfcfcf;
  --ok-bg:#16301f; --warn-bg:#33270f; --bad-bg:#3a1a18; --info-bg:#172840; --shop-bg:#2a2a2a;
  color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(84px + env(safe-area-inset-bottom,0px))}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;justify-content:space-between}
header.top h1{font-family:var(--f-display);font-weight:700;font-size:23px;letter-spacing:.02em;margin:0;text-transform:uppercase}
.who{font-size:14px;color:var(--muted);text-align:right;line-height:1.2}
.net{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px;margin-top:3px}
.net.on{background:var(--ok-bg);color:var(--ok)} .net.off{background:var(--warn-bg);color:var(--warn)}
.net i{width:8px;height:8px;border-radius:50%;background:currentColor;display:block}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:22px 0 6px}
h3{font-family:var(--f-display);font-weight:600;font-size:18px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:22px 0 8px}
p.lead{color:var(--muted);margin:0 0 14px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;min-width:0}
label{font-weight:600;font-size:15px}
.req{color:var(--bad)}
.hint{font-size:13px;color:var(--muted)}
input,select,textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:12px;width:100%;min-height:50px}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.row{grid-template-columns:1fr}}
.tstep{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-bottom:12px}
.tstep .field{margin:0}
.btn{font:inherit;font-weight:600;font-size:17px;border:0;border-radius:10px;padding:14px 18px;min-height:52px;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.wa{background:#1d8f4e;color:#fff}
.btn.small{min-height:44px;padding:8px 14px;font-size:15px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input:disabled{opacity:.55;cursor:not-allowed}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;padding:10px 0;cursor:pointer;text-decoration:underline}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.actions .btn{flex:1 1 160px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;padding:9px 13px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.list{display:flex;flex-direction:column;gap:10px}
.card .head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .unit{font-weight:600;font-size:17px;min-width:0;overflow-wrap:anywhere}
.pm{font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.meta{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.desc{font-size:15px;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.s-atend{background:var(--warn-bg);color:var(--warn)} .s-ok{background:var(--ok-bg);color:var(--ok)}
.s-coi{background:var(--info-bg);color:var(--info)} .s-prog{background:var(--bad-bg);color:var(--bad)}
.s-cof{background:var(--shop-bg);color:var(--shop)}
.flags{display:flex;flex-wrap:wrap;gap:6px}
.flag{font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.flag.done{border-color:var(--ok);color:var(--ok)} .flag.pend{border-color:var(--warn);color:var(--warn)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(var(--n,3),1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom button{font:inherit;font-size:13px;font-weight:600;background:none;border:0;color:var(--muted);padding:9px 2px 10px;min-height:62px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.bottom button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
nav.bottom button[aria-current="page"]{color:var(--accent)}
.msgbox{font-family:var(--f-mono);font-size:13.5px;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:340px;overflow:auto;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.notice{border-radius:10px;padding:12px 14px;font-size:15px;margin:12px 0}
.notice.warn{background:var(--warn-bg);border:1px solid var(--warn)}
.notice a{color:var(--accent);font-weight:600;overflow-wrap:anywhere}
.notice.info{background:var(--accent-soft);border:1px solid var(--accent)}
.notice.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center}
.err{color:var(--bad);font-size:15px;font-weight:600;min-height:1em}
.empty{text-align:center;color:var(--muted);padding:26px 10px;border:1.5px dashed var(--line);border-radius:12px}
.inline-edit{display:grid;grid-template-columns:1fr auto;gap:8px}
details summary{cursor:pointer;font-weight:600;padding:8px 0}
.login{max-width:440px;margin:24px auto 0}
.senha-wrap{position:relative}
.senha-wrap input{padding-right:96px}
.olho{position:absolute;right:6px;top:50%;transform:translateY(-50%);font:inherit;font-size:14px;font-weight:600;background:var(--accent-soft);color:var(--ink);border:0;border-radius:6px;padding:8px 10px;cursor:pointer;min-height:36px}
.brand{font-family:var(--f-display);font-weight:700;font-size:30px;text-transform:uppercase;letter-spacing:.02em;margin:8px 0 4px}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.logo{display:block;height:34px;width:auto;border-radius:7px;background:#0150a2}
.logo-banda{display:flex;justify-content:center;align-items:center;background:linear-gradient(90deg,#014ea0,#0158ae);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.logo-banda img{display:block;height:58px;width:auto;max-width:100%}
.who{min-width:0}
@media (max-width:520px){.marca{flex-direction:column;align-items:flex-start;gap:3px}header.top .marca h1{font-size:14px;letter-spacing:.1em;color:var(--muted)}.logo{height:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="topo" hidden>
    <div class="marca"><img class="logo" id="logoTopo" alt="Compesa" width="113" height="34"><h1>Atendimentos</h1></div>
    <div class="who"><div id="whoName"></div><span id="net" class="net off"><i></i><span>Offline</span></span></div>
  </header>
  <main id="view"></main>
</div>

<nav class="bottom" id="nav" aria-label="Navegação" hidden>
  <button data-tab="novo"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Registrar</button>
  <button data-tab="servicos"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Serviços</button>
  <button data-tab="os" id="navOS" hidden><svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Fila de OS</button>
  <button data-tab="perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Perfil</button>
</nav>

/* ---------- utilitários ---------- */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function uid(){return "a"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function pad(n){return (n<10?"0":"")+n;}
function nowLocal(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes());}
function toDate(s){if(!s)return null;var d=new Date(s);return isNaN(d)?null:d;}
function fmtData(s){var d=toDate(s);return d?pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+String(d.getFullYear()).slice(2):"";}
function fmtHora(s){var d=toDate(s);return d?pad(d.getHours())+":"+pad(d.getMinutes()):"";}
function fmtDataHora(s){var d=toDate(s);return d?pad(d.getDate())+"/"+pad(d.getMonth()+1)+" "+pad(d.getHours())+":"+pad(d.getMinutes()):"";}
function mesmoDia(a,b){return String(a||"").slice(0,10)===String(b||"").slice(0,10);}
function stInfo(v){var t=STATUS.concat(STATUS_ANTIGOS);for(var i=0;i<t.length;i++)if(t[i].v===v)return t[i];return STATUS[0];}
function opts(arr,sel,vaz){return (vaz?'<option value="">'+vaz+'</option>':"")+arr.map(function(x){return '<option'+(x===sel?" selected":"")+'>'+esc(x)+'</option>';}).join("");}

/* ---------- comunicação com a planilha ---------- */
function api(acao,dados){
  if(!apiOk())return Promise.reject(new Error("O app ainda não foi ligado à planilha (API_URL)."));
  var corpo=Object.assign({acao:acao,token:S.token},dados||{});
  return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(corpo),redirect:"follow"})
    .then(function(r){return r.json();})
    .then(function(j){
      if(!j.ok&&j.erro==="SESSAO_INVALIDA"){encerrarSessao("Sua sessão expirou ou o acesso foi bloqueado. Entre novamente.");throw new Error("Sessão inválida");}
      return j;
    });
}
function encerrarSessao(msg){S.token=null;save();rota="entrar";aviso=msg||"";render();}

/* ---------- sincronização ---------- */
var sincronizando=false, erroSync="";
function pendentes(){return S.registros.filter(function(r){return !r.sincronizadoEm||r.atualizadoEm>r.sincronizadoEm;});}
function atualizaNet(){
  var el=$("#net");if(!el)return;var p=pendentes().length;var on=online()&&apiOk();
  el.className="net "+(on&&!p&&!erroSync?"on":"off");
  el.lastElementChild.textContent=!on?(p?p+" aguardando envio":"Sem internet"):(sincronizando?"Enviando...":(p?p+" aguardando envio":"Sincronizado"));
}
function mesclar(rec){
  if(!rec||!rec.id)return;
  var i=S.registros.findIndex(function(x){return x.id===rec.id;});
  if(i<0){rec.sincronizadoEm=rec.atualizadoEm;S.registros.push(rec);return;}
  var loc=S.registros[i];
  if((rec.atualizadoEm||"")>=(loc.atualizadoEm||"")){
    var comp=loc.compartilhadoEm;S.registros[i]=Object.assign({},rec,{sincronizadoEm:rec.atualizadoEm,compartilhadoEm:comp});
  }
}
function sincronizar(manual){
  if(!S.token||!online()||!apiOk()||sincronizando){atualizaNet();return Promise.resolve();}
  sincronizando=true;atualizaNet();
  var lote=pendentes().slice(0,50).map(function(r){var c=JSON.parse(JSON.stringify(r));delete c.sincronizadoEm;delete c.compartilhadoEm;return c;});
  var p=lote.length?api("salvar",{registros:lote}).then(function(j){
      if(!j.ok)throw new Error(j.erro);
      (j.salvos||[]).forEach(function(s){mesclar(s.registro);});
      (j.recusados||[]).forEach(function(id){var r=S.registros.find(function(x){return x.id===id;});if(r)r.sincronizadoEm=r.atualizadoEm;});
    }):Promise.resolve();
  return p.then(function(){return api("listar");}).then(function(j){
      if(!j.ok)throw new Error(j.erro);
      (j.registros||[]).forEach(mesclar);
      if(j.perfil)S.perfil=j.perfil;
      return api("config");
    }).then(function(j){
      if(j&&j.ok){S.unidades=j.unidades||S.unidades;S.regioes=j.regioes||S.regioes;if(j.perfil)S.perfil=j.perfil;}
      S.ultimaSync=new Date().toISOString();erroSync="";save();
      if(manual)toast("Sincronizado");
    }).catch(function(e){erroSync=e.message||"erro";if(manual)toast("Não foi possível sincronizar agora. Tentaremos de novo quando a conexão melhorar.");})
    .then(function(){sincronizando=false;save();atualizaNet();if(pendentes().length&&!erroSync)return sincronizar();if(rota==="servicos"||rota==="os")render();});
}
window.addEventListener("online",function(){erroSync="";sincronizar();});
window.addEventListener("offline",atualizaNet);
setInterval(function(){if(online()&&S.token)sincronizar();},120000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&online()&&S.token)sincronizar();});

/* ---------- mensagens do WhatsApp ---------- */
function linhaHorario(r){
  if(!r.tInicio&&!r.tFim)return "";
  var f=r.tFim?(mesmoDia(r.tInicio,r.tFim)?fmtHora(r.tFim):fmtData(r.tFim)+" "+fmtHora(r.tFim)):"em andamento";
  return "*Início do serviço:* "+(r.tInicio?fmtHora(r.tInicio):"-")+" | *Fim do serviço:* "+f;
}
function msgServico(r){
  var st=stInfo(r.status),L=[];
  L.push("*Balanço dos Serviços - "+(r.regiao||"")+"*");L.push("");
  L.push("*PM:* "+(r.pm||"-"));
  L.push("*Local:* "+(r.unidade||"")+(r.idObj?" (ID objeto "+r.idObj+")":(r.cc?" (CC "+r.cc+")":"")));
  if(r.tInicio)L.push("*Data:* "+fmtData(r.tInicio));
  L.push("*Equipe:* "+(r.equipe||[]).join(", "));
  if(r.equipamento)L.push("*Equipamento:* "+r.equipamento+(r.equipId?" - "+r.equipId:""));
  L.push("*Tipo Manut.:* "+(r.tipo||""));
  if(r.impactoProd||r.impacto)L.push("*Impacto na produção:* "+(r.impactoProd||r.impacto));
  L.push(st.e+" *Status:* "+r.status);
  if(r.motivoPend&&r.status==="Pendente")L.push("*Motivo da pendência:* "+r.motivoPend);
  if(r.tipoFalha)L.push("*Tipo Falha:* "+r.tipoFalha);
  if(r.acao)L.push("*Resumo:* "+r.acao);
  var h=linhaHorario(r);if(h)L.push(h);
  if(r.obs){L.push("");L.push("Obs.: "+r.obs);}
  return L.join("\n");
}
var POR_PARTE=10;
function msgCompletas(lista){
  var ord=lista.slice().sort(function(a,b){return String(a.tInicio||"").localeCompare(String(b.tInicio||""));}),partes=[];
  for(var i=0;i<ord.length;i+=POR_PARTE)partes.push(ord.slice(i,i+POR_PARTE));
  return partes.map(function(g,k){
    var cab=partes.length>1?"*Parte "+(k+1)+" de "+partes.length+"*\n\n":"";
    return {regs:g,txt:cab+g.map(msgServico).join("\n\n------------------------------\n\n")};
  });
}
function msgBoletim(lista,titulo){
  var L=["*"+titulo+"*",""],porTipo={};
  lista.forEach(function(r){(porTipo[r.tipo||"Outros"]=porTipo[r.tipo||"Outros"]||[]).push(r);});
  TIPOS.concat(["Outros"]).forEach(function(t){
    var g=porTipo[t];if(!g)return;
    L.push("*"+t.toUpperCase()+"*");L.push("");
    var porReg={};g.forEach(function(r){(porReg[r.regiao||"-"]=porReg[r.regiao||"-"]||[]).push(r);});
    Object.keys(porReg).forEach(function(rg){
      L.push("*"+rg+":*");
      porReg[rg].forEach(function(r){
        var def=[r.tipoFalha,r.status==="Pendente"?r.motivoPend:""].filter(Boolean).join(" - ");
        L.push(stInfo(r.status).e+"PM "+(r.pm||"-")+" - "+(r.unidade||"")+(r.equipId?" - "+r.equipId:"")+(def?" - "+def+".":""));
        if(r.acao)L.push("*"+r.acao+"*");
        var h=linhaHorario(r);if(h)L.push(h.replace(/\*/g,""));
      });
      L.push("");
    });
  });
  STATUS.forEach(function(s){L.push(s.e+s.v);});
  return L.join("\n");
}

function waHref(t){return celular?"whatsapp://send?text="+encodeURIComponent(t):"https://api.whatsapp.com/send?text="+encodeURIComponent(t);}
function copiar(t,el){
  var ok=function(){toast("Mensagem copiada");};
  try{navigator.clipboard.writeText(t).then(ok,function(){selecionar(el);});}catch(e){selecionar(el);}
}
function selecionar(el){if(!el)return;var rg=document.createRange();rg.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(rg);toast("Texto selecionado. Toque em Copiar.");}
function compartilhar(t,el){
  if(navigator.share){navigator.share({text:t}).catch(function(){});}else copiar(t,el);

function achar(id){return S.registros.find(function(r){return r.id===id;})||null;}

  r.historico=(r.historico||[]).concat([{por:S.perfil.nome,em:r.atualizadoEm,acao:acao}]).slice(-30);

function validar(r){
  if(!r.regiao)return "Escolha a regional.";
  if(!r.unidade)return "Escolha a unidade ou digite o nome.";
  if(!r.pm)return "Informe o número da PM.";
  if(!r.equipamento)return "Escolha o equipamento.";
  if(!r.impactoProd)return "Responda se teve impacto na produção.";
  if(!r.tipoFalha)return "Escolha o tipo de falha.";
  if(!r.tInicio)return "Informe o horário de início do serviço.";
  if(r.tFim&&r.tFim<r.tInicio)return "O fim do serviço está antes do início. Corrija os horários.";
  if(r.tAbertura&&r.tAbertura>r.tInicio)return "A abertura do chamado está depois do início do serviço.";
  if(r.tFalha&&r.tAbertura&&r.tFalha>r.tAbertura)return "A parada do equipamento está depois da abertura do chamado.";
  if(!r.status)return "Escolha o status.";
  if(r.status==="Pendente"&&!r.motivoPend)return "Informe o motivo da pendência (por que está parado).";
  if(r.status==="Pendente"&&r.tFim)return "Atendimento pendente não pode ter fim do serviço.";
  if(r.status==="Resolvido"){
    if(!r.tFim)return "Para encerrar como resolvido, informe o fim do serviço.";
    if(!r.acao)return "Para encerrar, descreva o que foi feito.";
  }
  return "";
}

  var h='<h2>Meus serviços</h2>'+
   '<div class="chips" id="sF" style="margin-bottom:10px">'+[["hoje","Hoje"],["abertos","Em aberto"],["todos","Todos"]].map(function(x){return '<button type="button" class="chip" aria-pressed="'+(filtro===x[0])+'" data-v="'+x[0]+'">'+x[1]+'</button>';}).join("")+'</div>'+
   '<div class="actions" style="margin-bottom:14px"><button class="btn" id="sNovo" type="button">Novo atendimento</button><button class="btn sec" id="sBol" type="button"'+(lista.length?"":" disabled")+'>Compartilhar '+(filtro==="hoje"?"os de hoje":(filtro==="todos"?"todos (completo)":"esta lista"))+'</button></div>';
  h+=lista.length?'<div class="list" id="sL">'+lista.map(function(r){return card(r);}).join("")+'</div>':
    '<div class="empty">'+(S.registros.length?"Nenhum serviço neste filtro.":"Nenhum serviço registrado ainda. Toque em <strong>Novo atendimento</strong> para começar.")+'</div>';
  h+='<div id="sBox"></div>';
  v.innerHTML=h;
  $("#sF").addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;filtro=b.dataset.v;render();});
  $("#sNovo").onclick=function(){ir("novo");};
  var L=$("#sL");if(L){L.addEventListener("click",function(e){var c=e.target.closest("[data-id]");if(c)ir("detalhe",c.dataset.id);});
    L.addEventListener("keydown",function(e){if(e.key==="Enter"){var c=e.target.closest("[data-id]");if(c)ir("detalhe",c.dataset.id);}});}
  $("#sBol").onclick=function(){
    if(filtro==="todos"){
      var partes=msgCompletas(lista);
      $("#sBox").innerHTML='<h3>'+(partes.length>1?"Mensagens prontas ("+partes.length+" partes)":"Mensagem pronta")+'</h3>'+partes.map(function(pt,k){
        return (partes.length>1?'<p class="hint">Parte '+(k+1)+' de '+partes.length+' · '+pt.regs.length+' atendimento(s)</p>':"")+'<div class="msgbox" id="b'+k+'Msg">'+esc(pt.txt)+'</div>'+botoesEnvio("b"+k);}).join("");
      partes.forEach(function(pt,k){ligarEnvio("b"+k,pt.txt,$("#b"+k+"Msg"),function(){var t=new Date().toISOString();pt.regs.forEach(function(r){var x=achar(r.id);if(x)x.compartilhadoEm=t;});save();});});
      $("#sBox").scrollIntoView({behavior:"smooth",block:"start"});
      return;
    }
    var txt=msgBoletim(lista,"Balanço dos Serviços - "+S.perfil.nome+" - "+fmtData(nowLocal()));
    $("#sBox").innerHTML='<h3>Boletim pronto</h3><div class="msgbox" id="bMsg">'+esc(txt)+'</div>'+botoesEnvio("b");
    ligarEnvio("b",txt,$("#bMsg"),function(){var t=new Date().toISOString();lista.forEach(function(r){var x=achar(r.id);if(x)x.compartilhadoEm=t;});save();});
    $("#sBox").scrollIntoView({behavior:"smooth",block:"start"});
  };
}

/* ---------- fila de OS (responsável) ---------- */
function telaOS(v){
  if(!ehResp()){ir("servicos");return;}
  var lista=S.registros.filter(function(r){return filtroOS==="pend"?r.osStatus!=="Fechada no sistema":true;});
  lista.sort(function(a,b){return String(a.tInicio||"").localeCompare(String(b.tInicio||""));});
  var h='<h2>Fila de OS</h2><p class="lead">Lance o número da PM e marque quando a OS for aberta e fechada no sistema. Precisa de internet para gravar na base.</p>'+
   '<div class="chips" id="oF" style="margin-bottom:12px">'+[["pend","Pendentes"],["todas","Todas"]].map(function(x){return '<button type="button" class="chip" aria-pressed="'+(filtroOS===x[0])+'" data-v="'+x[0]+'">'+x[1]+'</button>';}).join("")+'</div>';
  h+=lista.length?'<div class="list" id="oL">'+lista.map(function(r){
    return card(r,'<div class="inline-edit"><input aria-label="Número da PM" inputmode="numeric" placeholder="Número da PM" value="'+esc(r.pm)+'" data-pm="'+esc(r.id)+'"><button type="button" class="btn sec small" data-savepm="'+esc(r.id)+'">Salvar PM</button></div>'+
      '<div class="chips">'+OSST.map(function(s){return '<button type="button" class="chip" data-os="'+esc(r.id)+'" data-v="'+s+'" aria-pressed="'+((r.osStatus||"Não lançada")===s)+'">'+s+'</button>';}).join("")+'</div>');
  }).join("")+'</div>':'<div class="empty">Nenhuma OS pendente.</div>';
  v.innerHTML=h;
  $("#oF").addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;filtroOS=b.dataset.v;render();});
  var L=$("#oL");if(!L)return;
  L.addEventListener("click",function(e){
    var t=e.target;
    if(t.dataset.savepm){osAtualizar(t.dataset.savepm,{pm:L.querySelector('[data-pm="'+t.dataset.savepm+'"]').value.trim()});return;}
    if(t.dataset.os){osAtualizar(t.dataset.os,{osStatus:t.dataset.v});return;}
    if(t.closest("input,button"))return;
    var c=t.closest("[data-id]");if(c)ir("detalhe",c.dataset.id);
  });
}
function osAtualizar(id,mud){
  if(!online()){toast("Sem internet. A fila de OS precisa de conexão para gravar.");return;}
  var r=achar(id);
  if(r&&pendentes().some(function(x){return x.id===id;})){toast("Este atendimento ainda não chegou na base. Sincronize primeiro.");return;}
  api("os",Object.assign({id:id},mud)).then(function(j){if(!j.ok)throw new Error(j.erro);mesclar(j.registro);save();toast(mud.pm!==undefined?"PM salva":"OS: "+mud.osStatus);render();})
    .catch(function(e){toast(e.message);});
}
